location = /beijing-map { return 301 /beijing-map/; }
location = /beijing-map/ { rewrite ^ /beijing-map/index.html last; }
location = /beijing-map/index.html {
    alias /var/www/beijing-3d-travel-map/current/index.html;
    add_header Cache-Control "no-cache";
}
location ^~ /beijing-map/public/ {
    alias /var/www/beijing-3d-travel-map/current/public/;
    autoindex off;
    include /etc/nginx/mime.types;
    types { application/javascript mjs; application/wasm wasm; }
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options nosniff;
}
location ^~ /beijing-map/api/travel/ {
    limit_req zone=beijing_ip burst=12 nodelay;
    limit_req zone=beijing_total burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 32k;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:5199/api/travel/;
    proxy_set_header Host airesumejob.xyz;
    proxy_read_timeout 45s;
    access_log off;
}
location /beijing-map/ { return 404; }
